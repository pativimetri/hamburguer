<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <link rel="stylesheet" href="estilos/mediaqueries.css">

    <title>Menu Hamburguer | X-Bacon </title>
</head>
<body onresize="mudouTamanho()">
    <header>
        <h1>Hamburguers</h1>
        <span class="material-symbols-outlined" onclick="clickMenu()">
menu
</span>
        <menu id="itens">
            <ul>
                <li><a href="https://pativimetri.github.io/hamburguer/x-burguer">X-Bacon</a></li>
                <li><a href="#">X-Salada</a></li>
                <li><a href="#">Cheddar Bacon</a></li>
                <li><a href="#">X-Egg</a></li>
                <li><a href="#">Duplo Smash</a></li>
            </ul>
        </menu>
    </header>
    <main>
        <article>
            <h2>X-Bacon</h2>
          <img src="img/xbacon.png" alt=""width="60%" margin="auto">
        </article>
    </main>
    <script>
        function clickMenu(){
            if (itens.style.display == 'block'){
                itens.style.display = 'none'
            } else {
                itens.style.display = 'block'
            }
        }

        function mudouTamanho(){
            if(window.innerWidth >= 768){
                itens.style.display = 'block'
            } else {
                itens.style.display = none;
            }
        }
    </script>
</body>
</html>
